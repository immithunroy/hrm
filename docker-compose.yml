services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zkt_payroll
      TZ: Asia/Dhaka
      PGTZ: Asia/Dhaka
    command: ["postgres", "-c", "timezone=Asia/Dhaka"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/zkt_payroll?schema=public
      NODE_ENV: production
      PORT: 5000
      TZ: Asia/Dhaka
      JWT_SECRET: ${JWT_SECRET:-change-this-production-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-secret}
      ZKT_DEVICE_IP: ${ZKT_DEVICE_IP:-192.168.31.5}
      ZKT_DEVICE_PORT: "4370"
      ZKT_DEVICE_TIMEOUT: "5000"
      ZKT_DEVICE_USERNAME: ${ZKT_DEVICE_USERNAME:-}
      ZKT_DEVICE_PASSWD: ${ZKT_DEVICE_PASSWD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://103.177.54.6:8060}
      FRONTEND_URL: ${FRONTEND_URL:-http://103.177.54.6:8060}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://103.177.54.6:8060/api/auth/google/callback}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-session-secret}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push --skip-generate && node dist/server.js"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Dhaka
    ports:
      - "8060:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads: